- id: "2-1"
  title: Generate and trace explanations
  description: >-
    Extend run_agent.py with one LLM call per line item after
    decision_engine.decide_claim runs, producing a clause-citing explanation
    (CAP-7). Wrap the run in MLflow tracing under the expense-claim-reviewer
    experiment, distinguishing it from Saturday's traces in the shared store.
  spec_checkpoint: false
  done_checkpoint: false
- id: "2-2"
  title: Score a run against the labelled set
  description: >-
    Build eval/run_eval.py: reads decisions and eval/labelled.csv, checks
    decision match, clause match, and per-claim reimbursable-total match
    (CAP-8), reporting pass/fail across the 30 labelled claims via one
    command. Independent of 2-1 (only needs Epic 1's decisions table).
  spec_checkpoint: false
  done_checkpoint: false
- id: "2-3"
  title: Judge explanations with an LLM judge
  description: >-
    One command has JUDGE_MODEL (via Groq) judge every explanation from the
    latest real run's expense-claim-reviewer traces for clarity and correct
    clause citation, reporting per-criterion pass counts and each failure
    (CAP-9). Judges only; decision/clause scoring stays in story 2-2.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Story 2-1 found openai/gpt-oss-120b on Groq does not reliably honor
    forced tool-calling for structured output on long prompts; use
    method="json_mode" for the judge's structured output.
    cases/expense/export_results.py already selects the latest real-LLM
    trace per claim; reuse that selection.
